<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SmartPro ფასების კალკულატორი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: work-surface tool — series rail on top, product checklist left, live offer ledger right (sticky). Navy + steel-blue SmartPro ink on a cool paper ground. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#e9ecf0; --line:#d7dce3; --ink:#152233; --muted:#5d6878;
  --accent:#2c6a9e; --accent-ink:#ffffff; --accent-soft:#e1ecf6; --gold:#b48a3c;
  --good:#1f7a4d; --warn:#a45a12; --bad:#b3261e;
  --f-body:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#161e29; --sunk:#1d2734; --line:#2b3746; --ink:#e7ecf2; --muted:#9aa6b5;
  --accent:#6aa7da; --accent-ink:#0b1622; --accent-soft:#1c3348; --gold:#d6b26a;
  --good:#5ec48f; --warn:#e3a35c; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#161e29; --sunk:#1d2734; --line:#2b3746; --ink:#e7ecf2; --muted:#9aa6b5;
  --accent:#6aa7da; --accent-ink:#0b1622; --accent-soft:#1c3348; --gold:#d6b26a;
  --good:#5ec48f; --warn:#e3a35c; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.off{background:var(--warn)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner.warn{border-color:var(--warn)}
h2.step{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;gap:8px;align-items:center}
h2.step b{background:var(--ink);color:var(--bg);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px}
/* series rail */
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.scard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:border-color .15s, transform .15s}
.scard:hover{border-color:var(--accent)}
.scard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.scard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.scard .t{padding:7px 9px 9px}
.scard .t strong{display:block;font-size:14px}
.scard .t span{font-size:11.5px;color:var(--muted)}
.scard .sw{display:flex;gap:3px;margin-top:5px}
.scard .sw i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.phead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sinfo{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.sinfo img{width:84px;height:63px;object-fit:cover;border-radius:6px;flex:none}
.sinfo h3{margin:0;font-size:16px}
.sinfo p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:60ch}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 5px;font-size:12.5px}
.cbtn i{width:18px;height:18px;border-radius:50%;border:1px solid rgb(0 0 0 / .15)}
.cbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.k[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.search{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;min-width:0;width:190px;max-width:100%}
.list{max-height:none}
.grp{padding:6px 14px 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:24px 46px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.on{background:var(--accent-soft)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.row .ic{width:46px;height:34px;display:grid;place-items:center}
.row .ic svg{max-width:46px;max-height:34px}
.row .nm{min-width:0}
.row .nm b{font-family:var(--f-num);font-size:12px;font-weight:500;color:var(--muted);margin-right:6px}
.row .nm span{font-size:13.5px}
.row .pr{text-align:right;font-size:12.5px;white-space:nowrap}
.row .pr small{display:block;color:var(--muted);font-size:11px}
.missing{color:var(--warn);font-size:11.5px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:var(--sunk);width:26px;height:28px;font-size:15px;line-height:1}
.qty input{width:44px;border:0;text-align:center;background:transparent;height:28px;font-family:var(--f-num)}
.qty input::-webkit-inner-spin-button{display:none}
@media (max-width:560px){.row{grid-template-columns:22px 38px minmax(0,1fr);}.row .pr,.row .qty{grid-column:3}.row .ic{width:38px}}
/* offer ledger */
.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.ledger .phead h3{margin:0;font-size:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500}
.fields label.full{grid-column:1/-1}
.fields input,.fields textarea,.fields select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:13.5px;color:var(--ink);min-width:0}
.lines{max-height:46vh;overflow:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.line .t{font-size:13px;min-width:0}
.line .t b{font-family:var(--f-num);font-weight:500;font-size:11.5px;color:var(--muted)}
.line .t i{font-style:normal;color:var(--muted);font-size:11.5px}
.line .x{border:0;background:transparent;color:var(--muted);font-size:16px;padding:0 2px;align-self:start}
.line .m{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.line .m input.sale{width:80px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
.line .m input.sale.man{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--bg))}
.line .m .sum{margin-left:auto;color:var(--ink);font-weight:700;font-size:13.5px}
.line .m label{display:flex;align-items:center;gap:5px}
.line .m input.lq,.line .m input.lmk{width:58px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);text-align:right;font-family:var(--f-num);color:var(--ink)}
.line .m input.lmk.derived{color:var(--muted);font-style:italic}
.line .pf{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent);border-radius:6px;padding:4px 8px}
.line .pf .neg{color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.totals{padding:12px 14px;display:grid;gap:5px;border-top:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between;gap:10px;font-size:13px}.totals div span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.totals .big{font-size:17px;font-weight:700}
.totals .profit{color:var(--good)}
.mk{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mk input{width:70px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--bg);font-family:var(--f-num);text-align:right}
.actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted);padding:0 14px 12px}
/* prices table */
.tblwrap{overflow-x:auto}
table.pt{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.pt th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.pt td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pt td.code{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
table.pt input{width:86px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-family:var(--f-num);text-align:right}
table.pt input.c{width:72px}
table.pt tr.has td.code{color:var(--good)}
table.pt .cost{font-family:var(--f-num);text-align:right;white-space:nowrap}
table.pt .sale{font-weight:600;color:var(--accent)}
.line.lv-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);box-shadow:inset 3px 0 0 var(--bad)}
.line.lv-bad input.sale{border-color:var(--bad);color:var(--bad)}
.line.lv-warn{background:color-mix(in srgb,#e0b400 16%,transparent);box-shadow:inset 3px 0 0 #d4a800}
.line.lv-warn input.sale{border-color:#d4a800}
.lvmsg{font-size:11.5px;font-weight:600;grid-column:1/-1}.lvmsg:empty{display:none}
.line.lv-bad .lvmsg{color:var(--bad)}.line.lv-warn .lvmsg{color:var(--warn)}
tr.lv-warn td{background:color-mix(in srgb,#e0b400 12%,transparent)}tr.lv-bad td{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap}
.badge.warn{background:#f6e7a8;color:#6b4e00}.badge.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}.badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.smkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
table.qt td{vertical-align:middle}table.qt .btn{padding:5px 10px;font-size:12px}
.saved{font-size:12px;color:var(--good);min-height:16px}
/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px}
.sgrid fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:9px;min-width:0}
.sgrid legend{font-weight:700;font-size:13px;padding:0 6px}
.sgrid label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.sgrid input,.sgrid select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;color:var(--ink);min-width:0}
.formula{margin:0 16px 16px;padding:12px 14px;background:var(--sunk);border-radius:var(--r);font-size:12.5px;line-height:1.7}
/* modal */
.modal{position:fixed;inset:0;background:rgb(10 16 24 / .55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--surface);border-radius:12px;width:min(900px,100%);height:min(88vh,1100px);display:flex;flex-direction:column;overflow:hidden}
.modal .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .bar strong{margin-right:auto}
.modal iframe{flex:1;border:0;background:#fff;width:100%}
.thumb{border:0;padding:0;background:none;border-radius:6px;overflow:hidden;flex:none}
.btn.gal{margin-top:6px;padding:5px 11px;font-size:12px;background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.box.gallery{width:min(1200px,100%)}
.gscroll{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--sunk)}
.gimg{flex:none;display:block;width:100%;border:0;padding:0;background:#fff;border-radius:8px;overflow:hidden;cursor:zoom-in;box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.gimg img{display:block;width:100%;height:auto}
.gimg.zoom{cursor:zoom-out;width:200%;max-width:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px}
.kpis div{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpis span{font-size:12px;color:var(--muted)}.kpis b{font-family:var(--f-num);font-size:18px}
.kpis .good b{color:var(--good)}
table.it{min-width:1250px}table.it td{vertical-align:middle;white-space:nowrap}table.it td:first-child{white-space:normal;min-width:220px}
table.it .sub{font-size:11px;color:var(--muted)}table.it .sub.man{color:var(--gold)}
table.it input{width:70px}table.it input.iq{width:56px}table.it input.imk.derived{color:var(--muted);font-style:italic}
table.it input.isale.man{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--bg))}
table.it .strong{font-weight:700}table.it .profit{color:var(--good)}table.it tr.negrow .profit{color:var(--bad)}
table.it tr.tot td{background:var(--sunk);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 28 6v10c0 8-5.6 14-13 17C7.6 30 2 24 2 16V6Z" fill="var(--accent)"/><path d="M17 7 9 19h5l-2 8 8-12h-5Z" fill="var(--accent-ink)"/></svg>
      <div><h1>SmartPro ფასების კალკულატორი</h1><small>ჩამრთველები და როზეტები — თვითღირებულება და კლიენტის შეთავაზება</small></div>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-quote" role="tab" aria-selected="true" data-tab="quote">შეთავაზების შედგენა</button>
      <button id="tab-prices" role="tab" aria-selected="false" data-tab="prices">ფასები და წონა</button>
      <button id="tab-quotes" role="tab" aria-selected="false" data-tab="quotes">შეთავაზებები</button>
      <button id="tab-internal" role="tab" aria-selected="false" data-tab="internal">შიდა კალკულატორი</button>
      <button id="tab-settings" role="tab" aria-selected="false" data-tab="settings">ხარჯების პარამეტრები</button>
    </nav>
    <div class="status" style="flex-direction:column;align-items:flex-end;gap:2px"><span style="display:flex;gap:6px;align-items:center"><span class="dot" id="dbdot"></span><span id="dbtxt">მონაცემები იტვირთება</span></span><span id="rateinfo"></span></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("sp_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("sp_"+k,JSON.stringify(v))}catch(e){}}};

const DEFAULTS={currency:"USD",usd:2.70,cny:0.38,freight:3,customs:0,bank:1,other:0,vat:false,markup:80,round:0,autoRate:true,rateType:"sell",rateAt:null,rateErr:null,
  company:"შპს სმარტპრო ჯორჯია",phone:"+995 591 011 805",email:"akaki.i@smartpro.ge",address:"აკაკი წერეთლის ქუჩა 56, თბილისი",web:"smartpro.ge",validity:7,minMk:30,okMk:80,otherFix:0,shipFix:0,shipQty:1000,
  footer:"ფასები მოიცავს დღგ-ს. მონტაჟის ღირებულება გამოითვლება ცალკე."};

const CAT={switch:"ჩამრთველები და რეგულატორები",socket:"როზეტები",weak:"ტელევიზია, ინტერნეტი, ტელეფონი",other:"სხვა",frame:"ჩარჩოები"};
const CATSHORT={switch:"ჩამრთველები",socket:"როზეტები",weak:"სუსტი დენი",other:"სხვა",frame:"ჩარჩოები"};

/* ---------- icons ---------- */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const L=(r*299+g*587+b*114)/1000;const k=L>140?-amt:amt;r=Math.max(0,Math.min(255,r+k));g=Math.max(0,Math.min(255,g+k));b=Math.max(0,Math.min(255,b+k));return`rgb(${r},${g},${b})`}
function icon(type,hex){
  const f=hex,s=shade(hex,60),d=shade(hex,95);
  const plate=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5" fill="${f}" stroke="${s}" stroke-width="1"/>`;
  const sock=(cx,cy,r=8.5,ground=true)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${s}" stroke-width="1.2"/><circle cx="${cx-3.6}" cy="${cy}" r="1.3" fill="${d}"/><circle cx="${cx+3.6}" cy="${cy}" r="1.3" fill="${d}"/>${ground?`<rect x="${cx-1.2}" y="${cy-r+.6}" width="2.4" height="2.2" fill="${d}"/>`:""}`;
  let inner="",vb="0 0 40 40",body=plate(4,4,32,32);
  const m=type.match(/^frame(\d)(v?)$/);
  if(m){const k=+m[1],v=!!m[2],u=13,g=2;const W=k*u+(k+1)*g,H=u+2*g;
    if(v){vb=`0 0 ${H+4} ${W+4}`;body=plate(2,2,H,W);for(let i=0;i<k;i++)inner+=`<rect x="${2+g}" y="${2+g+i*(u+g)}" width="${u}" height="${u}" rx="1.5" fill="none" stroke="${s}" stroke-width="1" stroke-dasharray="2 1.5"/>`}
    else{vb=`0 0 ${W+4} ${H+4}`;body=plate(2,2,W,H);for(let i=0;i<k;i++)inner+=`<rect x="${2+g+i*(u+g)}" y="${2+g}" width="${u}" height="${u}" rx="1.5" fill="none" stroke="${s}" stroke-width="1" stroke-dasharray="2 1.5"/>`}
    return`<svg viewBox="${vb}" width="${v?24:Math.min(46,(k*15+6))}" height="${v?34:20}" aria-hidden="true">${body}${inner}</svg>`}
  switch(type){
    case"sw1":inner=`<rect x="9" y="9" width="22" height="22" rx="1.5" fill="none" stroke="${s}"/>`;break;
    case"sw2":inner=`<rect x="9" y="9" width="22" height="22" rx="1.5" fill="none" stroke="${s}"/><line x1="20" y1="9" x2="20" y2="31" stroke="${s}"/>`;break;
    case"sw3":inner=`<rect x="9" y="9" width="22" height="22" rx="1.5" fill="none" stroke="${s}"/><line x1="16.3" y1="9" x2="16.3" y2="31" stroke="${s}"/><line x1="23.7" y1="9" x2="23.7" y2="31" stroke="${s}"/>`;break;
    case"curtain":inner=`<rect x="9" y="9" width="22" height="22" rx="1.5" fill="none" stroke="${s}"/><line x1="20" y1="9" x2="20" y2="31" stroke="${s}"/><path d="M14.5 17l-2.5 4h5zM25.5 23l-2.5-4h5z" fill="${d}"/>`;break;
    case"bell":inner=`<path d="M20 13c-3.3 0-5 2.6-5 5.6v3.6l-1.6 2h13.2l-1.6-2v-3.6c0-3-1.7-5.6-5-5.6z" fill="none" stroke="${d}" stroke-width="1.2"/><circle cx="20" cy="26.6" r="1.3" fill="${d}"/>`;break;
    case"sock":inner=sock(20,20);break;
    case"sockr":inner=sock(20,20,8.5,false);break;
    case"sockf":inner=sock(20,20)+`<circle cx="20" cy="15.6" r="1" fill="${d}"/>`;break;
    case"usb":inner=sock(20,22,7.5)+`<rect x="9" y="8" width="5" height="2.6" rx=".5" fill="${d}"/><rect x="27" y="8" width="3.6" height="2" rx="1" fill="${d}"/>`;break;
    case"usbf":inner=sock(20,22,7.5)+`<rect x="9" y="8" width="5" height="2.6" rx=".5" fill="${d}"/><rect x="27" y="8" width="3.6" height="2" rx="1" fill="${d}"/>`;break;
    case"usbonly":inner=`<rect x="17.5" y="13" width="5" height="2.6" rx=".5" fill="${d}"/><rect x="18.2" y="24" width="3.6" height="2" rx="1" fill="${d}"/>`;break;
    case"sock2":vb="0 0 64 40";body=plate(3,4,58,32);inner=sock(19,20,9)+sock(45,20,9);break;
    case"tv":inner=`<circle cx="20" cy="19" r="4.5" fill="none" stroke="${d}" stroke-width="1.3"/><circle cx="20" cy="19" r="1.4" fill="${d}"/>`;break;
    case"tv2":inner=`<circle cx="14" cy="20" r="3.6" fill="none" stroke="${d}" stroke-width="1.2"/><circle cx="26" cy="20" r="3.6" fill="none" stroke="${d}" stroke-width="1.2"/>`;break;
    case"data":inner=`<rect x="15.5" y="15" width="9" height="8" rx="1" fill="none" stroke="${d}" stroke-width="1.3"/><rect x="18" y="20" width="4" height="3" fill="${d}"/>`;break;
    case"data2":inner=`<rect x="9.5" y="15" width="8" height="8" rx="1" fill="none" stroke="${d}" stroke-width="1.2"/><rect x="22.5" y="15" width="8" height="8" rx="1" fill="none" stroke="${d}" stroke-width="1.2"/>`;break;
    case"dimmer":inner=`<circle cx="20" cy="20" r="7" fill="${f}" stroke="${d}" stroke-width="1.3"/><line x1="20" y1="14.5" x2="20" y2="18" stroke="${d}" stroke-width="1.4"/>`;break;
    case"cover":inner=sock(20,22,7.5)+`<rect x="8" y="7" width="24" height="7" rx="1.5" fill="none" stroke="${s}" stroke-width="1"/>`;break;
    case"outlet":inner=`<circle cx="20" cy="18" r="6" fill="${d}"/>`;break;
    case"blank":inner="";break;
    default:inner=`<circle cx="20" cy="15" r="2" fill="${d}"/><rect x="18.8" y="19" width="2.4" height="9" rx="1.2" fill="${d}"/>`;
  }
  const wide=type==="sock2";
  return`<svg viewBox="${vb}" width="${wide?46:32}" height="${wide?29:32}" aria-hidden="true">${body}${inner}</svg>`;
}

/* ---------- money ---------- */
const N=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const gel=v=>v==null?"—":v.toLocaleString("ka-GE",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₾";
const cur=()=>settings.currency==="CNY"?"¥":"$";
function unitPrice(it,color){const p=prices[it.id];if(!p)return null;const o=p.colors&&N(p.colors[color]);return o!=null?o:N(p.price)}
function costOf(it,color){
  const price=unitPrice(it,color);if(price==null)return null;const S=settings;
  const rate=S.currency==="CNY"?N(S.cny):N(S.usd);const usd=N(S.usd)||0;
  const w=(N(prices[it.id]?.weight)||0)/1000;
  let c=price*rate*(1+(N(S.bank)||0)/100)+w*(N(S.freight)||0)*usd;
  c*=(1+(N(S.customs)||0)/100)*(1+(N(S.other)||0)/100);
  c+=fixedPerUnit();
  if(S.vat)c*=1.18;return c;
}
function costParts(it,color){
  const price=unitPrice(it,color);if(price==null)return null;const S=settings;
  const rate=S.currency==="CNY"?N(S.cny):N(S.usd);const usd=N(S.usd)||0;const wg=N(prices[it.id]?.weight)||0;
  const goods=price*rate,bank=goods*(N(S.bank)||0)/100,freight=wg/1000*(N(S.freight)||0)*usd,base=goods+bank+freight;
  const customs=base*(N(S.customs)||0)/100,other=(base+customs)*(N(S.other)||0)/100,fixed=fixedPerUnit();
  const pre=base+customs+other+fixed,vat=S.vat?pre*0.18:0;
  return{price,wg,goods,bank,freight,customs,other,fixed,vat,total:pre+vat}}
function fixedPerUnit(){const S=settings;const q=N(S.shipQty)||0;return (N(S.otherFix)||0)+(q>0?(N(S.shipFix)||0)/q:0)}
function roundUp(v){const r=N(settings.round)||0;return r>0?Math.ceil(v/r-1e-9)*r:Math.round(v*100)/100}
function smk(sid){const v=N(settings.seriesMk?.[sid]);return v!=null?v:(N(settings.markup)||0)}
function pmk(it){const v=N(prices[it.id]?.markup);return v!=null?v:smk(it.sid||byId[it.id]?.sid)}
function mkOf(line){const v=N(line.mk);return v!=null?v:pmk(byId[line.id])}
function saleOf(line){const it=byId[line.id];if(N(line.sale)!=null)return N(line.sale);const c=costOf(it,line.color);if(c==null)return null;return roundUp(c*(1+mkOf(line)/100))}
const fmt=v=>v==null?"":(Math.round(v*100)/100).toString();
function lineCalc(l){const it=byId[l.id];const c=costOf(it,l.color),sale=saleOf(l);const man=N(l.sale)!=null;
  const eff=c&&sale!=null?(sale/c-1)*100:null;return{c,sale,man,eff,amk:man?null:mkOf(l),pu:c!=null&&sale!=null?sale-c:null}}
function lvl(k){if(k.c==null||k.sale==null||!(k.c>0))return"";const e=k.amk!=null?k.amk:(k.sale/k.c-1)*100+0.05;const mn=N(settings.minMk)??30,ok=N(settings.okMk)??80;
  if(e<mn-1e-9)return"bad";if(e<ok-1e-9)return"warn";return""}
const LVMSG={get bad(){return isSuper()?"ფასი დასაშვებ მინიმუმზე დაბალია — დაშვებულია, რადგან სუპერ ადმინი ხართ":canRed()?"ფასი დასაშვებ მინიმუმზე დაბალია — შეინახება, მაგრამ კლიენტის ვერსია დაიბეჭდება სუპერ ადმინის დადასტურების შემდეგ":"ფასი დასაშვებ მინიმუმზე დაბალია — ასეთი ფასით შეთავაზება არ შეინახება"},warn:"ექსტრა ფასდაკლება"};
const role=()=>window.SP_ROLE||(window.parent===window?"super_admin":"specialist");
const isSuper=()=>role()==="super_admin";
const canRed=()=>role()==="super_admin"||role()==="admin";
function badCount(){return canRed()?0:cart.filter(l=>lvl(lineCalc(l))==="bad").length}
function redSig(lines){return lines.filter(l=>byId[l.id]&&lvl(lineCalc(l))==="bad").map(l=>l.id+"|"+l.color+"|"+(l.sale??"")+"|"+(l.mk??"")).sort().join(";")}
function approvalFor(lines,prev){const sig=redSig(lines);if(!sig)return null;
  if(isSuper())return{state:"approved",sig,at:new Date().toISOString()};
  if(prev?.approval?.state==="approved"&&prev.approval.sig===sig)return prev.approval;
  return{state:"pending",sig,at:new Date().toISOString()}}
const isPending=q=>q?.approval?.state==="pending";
const NEEDOK="ამ შეთავაზებაში ფასი მინიმუმზე დაბალია — კლიენტის ვერსია დაიბეჭდება სუპერ ადმინის დადასტურების შემდეგ";
function approvalBadge(q){return isPending(q)?'<span class="badge bad">ელოდება სუპერ ადმინის დადასტურებას</span>':q?.approval?.state==="approved"?'<span class="badge ok">დადასტურებულია</span>':""}
function syncLv(){const b=badCount(),r=!isSuper()&&cart.some(l=>lvl(lineCalc(l))==="bad")&&redSig(cart)!==(quotes.find(q=>curQ&&q.id===curQ.id)?.approval?.state==="approved"?quotes.find(q=>q.id===curQ.id).approval.sig:null);const sv=$("#saveq");if(sv)sv.disabled=!cart.length||b>0;["#preview","#download"].forEach(id=>{const el=$(id);if(el)el.disabled=!cart.length||b>0||r})}
function profitHtml(l,k){if(k.pu==null)return`<span class="missing">თვითღირებულება უცნობია — შეიყვანეთ ფასი</span>`;
  const cls=k.pu<0?"neg":"";return`<span class="${cls}">მოგება 1 ცალზე: <b class="num">${gel(k.pu)}</b></span><span class="${cls}">სულ ${l.qty} ცალზე: <b class="num">${gel(k.pu*l.qty)}</b></span><span>ნამატი ${k.eff==null?"—":k.eff.toFixed(1)+"%"}</span>`}
function totalsHtml(){let saleT=0,miss=0;cart.forEach(l=>{const k=lineCalc(l);if(k.sale==null)miss++;else saleT+=k.sale*l.qty});
  return`<div class="big"><span>სულ</span><span>${gel(saleT)}</span></div>${miss?`<div class="missing"><span>${miss} პოზიციას ფასი არ აქვს</span></div>`:""}`}
function syncRow(i){const l=cart[i];const r=document.querySelector(`.row[data-id="${CSS.escape(l.id)}"]`);if(r&&l.color===ui.color){const q=r.querySelector(".qty input");if(q)q.value=l.qty}}
function patchLine(i){const l=cart[i];const el=document.querySelector(`.line[data-i="${i}"]`);if(!l||!el)return;const k=lineCalc(l);const a=document.activeElement;
  const si=el.querySelector("[data-sale]"),mi=el.querySelector("[data-lmk]");
  if(si!==a)si.value=k.sale==null?"":k.sale.toFixed(2);si.classList.toggle("man",k.man);
  if(mi&&mi!==a)mi.value=k.man?(k.eff==null?"":k.eff.toFixed(1)):fmt(mkOf(l));
  el.querySelector(".sum").textContent=k.sale==null?"—":gel(k.sale*l.qty);const lv=lvl(k);el.classList.toggle("lv-bad",lv==="bad");el.classList.toggle("lv-warn",lv==="warn");const lm=el.querySelector(".lvmsg");if(lm)lm.textContent=lv?LVMSG[lv]:"";syncLv();
  const t=$("#totals");if(t)t.innerHTML=totalsHtml();saveCart()}

/* ---------- data layer ---------- */
/* ---------- host bridge (office.smartpro.ge) ---------- */
function hostBridge(){
  if(window.parent===window)return Promise.resolve(null);
  const host=window.parent,origin=location.origin;
  const subs={prices:[],quotes:[],settings:[]};let data=null;
  const fillLine=l=>{const it=byId[l.id];if(!it)return l;const s=catalog.series.find(x=>x.id===it.sid);const col=(s.colors.find(c=>c.id===l.color)||s.colors[0]);return{code:it.code,ka:it.ka,series:s.ka,colorKa:col.ka,...l}};
  const normQ=q=>({...q,client:{name:"",project:"",phone:"",note:"",...(q.client||{})},lines:(q.lines||[]).map(fillLine)});
  const emit=()=>{if(!data)return;
    const pd=Object.keys(data.prices||{}).map(id=>({id,data:()=>data.prices[id]}));
    subs.prices.forEach(cb=>cb({docChanges:()=>pd.map(doc=>({type:"added",doc})),docs:pd}));
    const qd=(data.quotes||[]).map(normQ).map(q=>({id:q.id,data:()=>q}));
    subs.quotes.forEach(cb=>cb({docChanges:()=>qd.map(doc=>({type:"added",doc})),docs:qd}));
    const s=data.settings;subs.settings.forEach(cb=>cb({exists:!!s&&Object.keys(s).length>0,data:()=>s}))};
  const write=(coll,id,value)=>{host.postMessage({type:"sp-write",coll,id,value},origin);return Promise.resolve()};
  const applyRole=role=>{const hide=role==="super_admin"?[]:role==="admin"?["settings"]:["prices","internal","settings"];
    hide.forEach(t=>{const b=document.getElementById("tab-"+t);if(b)b.remove()});
    if(hide.includes(ui.tab)){ui.tab="quote";saveUi()}};
  return new Promise(res=>{let done=false;
    window.addEventListener("message",e=>{if(e.source!==host||e.origin!==origin||!e.data)return;
      if(e.data.type==="sp-init"){data=e.data;window.SP_HOST=true;window.SP_ROLE=e.data.role;applyRole(e.data.role);
        if(!done){done=true;res(api)}else{emit();softRender()}}});
    const api={
      collection(name){return{onSnapshot(cb){subs[name].push(cb);setTimeout(emit,0);return()=>{}},doc(id){return{set:v=>write(name,id,v),delete:()=>write(name,id,null)}}}},
      doc(path){return{onSnapshot(cb){subs.settings.push(cb);setTimeout(emit,0);return()=>{}},set:v=>write("settings","main",v)}}};
    host.postMessage({type:"sp-ready"},origin);
    setTimeout(()=>{if(!done){done=true;res(null)}},4000)});
}

async function initData(){
  try{catalog=JSON.parse(document.getElementById("catalog-data").textContent)}catch(e){$("#view").innerHTML=`<div class="banner warn">კატალოგი ვერ ჩაიტვირთა. განაახლეთ გვერდი.</div>`;return}
  catalog.series.forEach(s=>s.items.forEach(it=>{byId[it.id]={...it,sid:s.id}}));
  cart=cart.filter(l=>byId[l.id]);
  prices=window.parent!==window?{}:LS.get("prices",{});settings={...DEFAULTS,...(window.parent!==window?{}:LS.get("settings",{}))};
  migrate();render();
  try{ db=await hostBridge() }catch(e){db=null}
  if(db){
    dbState="ok";
    db.collection("prices").onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==="removed")delete prices[ch.doc.id];else prices[ch.doc.id]=ch.doc.data()});softRender()},()=>{dbState="err";setStatus()});
    db.collection("quotes").onSnapshot(snap=>{quotes=snap.docs.map(d=>d.data());softRender()},()=>{});
    db.doc("settings/main").onSnapshot(d=>{if(d.exists){settings={...DEFAULTS,...d.data()};softRender()}},()=>{});
  }else dbState="local";
  setStatus();render();
  if(settings.autoRate)fetchRates(false);
}
function migrate(){if(!settings.v2){if(N(settings.validity)===14)settings.validity=7;if(N(settings.markup)===40)settings.markup=80;if(N(settings.round)===0.5)settings.round=0;settings.v2=true}}
function setStatus(){
  const dot=$("#dbdot"),t=$("#dbtxt");
  if(dbState==="ok"){dot.className="dot ok";t.textContent="ფასები ინახება office.smartpro.ge ბაზაში"}
  else if(dbState==="local"){dot.className="dot off";t.textContent="ფასები ინახება მხოლოდ ამ ბრაუზერში"}
  else if(dbState==="err"){dot.className="dot off";t.textContent="ბაზასთან კავშირი შეწყდა"}
}
const pending={};
function savePrice(id,patch){
  const next={...(prices[id]||{}),...patch};
  if(next.colors){for(const k in next.colors)if(next.colors[k]===""||next.colors[k]==null)delete next.colors[k]}
  prices[id]=next;
  if(db){clearTimeout(pending[id]);pending[id]=setTimeout(()=>{db.collection("prices").doc(id).set(next).then(()=>flash("შენახულია")).catch(e=>toast("ვერ შეინახა: "+(e.message||e.code)))},350)}
  else{LS.set("prices",prices);flash("შენახულია ამ ბრაუზერში")}
}
let setT;
function saveSettings(){
  if(db){clearTimeout(setT);setT=setTimeout(()=>db.doc("settings/main").set(settings).then(()=>flash("პარამეტრები შენახულია")).catch(e=>toast("ვერ შეინახა: "+(e.message||e.code))),400)}
  else{LS.set("settings",settings);flash("პარამეტრები შენახულია ამ ბრაუზერში")}
}
function flash(m){const el=$("#saved");if(el){el.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>el.textContent="",1600)}}

<style>@page{size:A4;margin:14mm}body{font-family:"Noto Sans Georgian",system-ui,sans-serif;color:#152233;margin:0;padding:24px;font-size:12.5px;background:#fff}
.hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #2c6a9e;padding-bottom:12px;margin-bottom:16px}
.hd h1{margin:0;font-size:20px;color:#2c6a9e}.hd .c{font-size:11.5px;line-height:1.6;color:#4a5566;text-align:right}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:14px;font-size:12px}.meta span{color:#5d6878}
table{width:100%;border-collapse:collapse}th{background:#eef3f8;text-align:left;font-size:11px;padding:7px 8px;color:#3d4a5c}td{padding:6px 8px;border-bottom:1px solid #dfe4ea;vertical-align:middle}
td.ic{width:44px}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.sub{color:#6b7684;font-size:11px}
.tot{display:flex;justify-content:flex-end;margin-top:12px}.tot div{background:#152233;color:#fff;padding:10px 16px;border-radius:6px;font-size:15px;font-weight:700}
.note{margin-top:16px;font-size:11.5px;color:#4a5566;line-height:1.6}.sign{margin-top:36px;display:flex;justify-content:space-between;font-size:11.5px;color:#4a5566}
@media print{body{padding:0}}</style></head><body>
<div class="hd"><div><h1>${esc(S2.company)}</h1><div style="font-size:12px;color:#4a5566">ჩამრთველები, როზეტები, ელექტრო მონტაჟი</div></div>
<div class="c">${esc(S2.phone)}<br>${esc(S2.email)}<br>${esc(S2.address)}<br>${esc(S2.web)}</div></div>
<h2 style="margin:0 0 10px;font-size:16px">კომერციული შეთავაზება № ${no}</h2>
<div class="meta"><div><span>თარიღი:</span> ${ds}</div><div><span>მოქმედებს:</span> ${esc(S2.validity)} დღე</div>
${client.name?`<div><span>კლიენტი:</span> ${esc(client.name)}</div>`:""}${client.project?`<div><span>ობიექტი:</span> ${esc(client.project)}</div>`:""}</div>
<table><thead><tr><th>№</th><th></th><th>დასახელება</th><th class="r">რაოდენობა</th><th class="r">ფასი (ლარი)</th><th class="r">ჯამი (ლარი)</th></tr></thead><tbody>${rows}</tbody></table>
<div class="tot"><div>სულ: ${tot.toFixed(2)} ლარი</div></div>
<div class="note">${client.note?esc(client.note)+"<br>":""}${esc(S2.footer)}</div>
<div class="sign"><div>შეადგინა: ____________________</div><div>${esc(S2.company)}</div></div>
<script>window.addEventListener("load",function(){if(location.protocol!=="about:"&&!window.frameElement)setTimeout(function(){window.print()},500)})<\/script>
</body></html>`;
}
let PAGES=null;function pageSrc(n){if(PAGES===null){try{PAGES=JSON.parse(document.getElementById("cat-pages")?.textContent||"{}")}catch(e){PAGES={}}}return PAGES[n]||(n.startsWith("/")?n:"/switch-catalog/pages/"+n)}
function showGallery(sid){const s=catalog.series.find(x=>x.id===sid);
  $("#modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="ფოტო კატალოგი"><div class="box gallery"><div class="bar"><strong>${esc(s.ka)} — ფოტო კატალოგი</strong><span style="font-size:12px;color:var(--muted)">დააჭირეთ გვერდს გასადიდებლად</span><button class="btn" id="m-close">დახურვა</button></div>
  <div class="gscroll">${s.pages.map((n,i)=>`<button class="gimg" aria-label="გვერდი ${i+1}"><img src="${pageSrc(n)}" alt="${esc(s.ka)}, გვერდი ${i+1}" loading="lazy"></button>`).join("")}</div></div></div>`}
function showPreview(){if(saveQuote(true)===false)return;if(isPending(saveQuote.last)){toast(NEEDOK);render();return}
  $("#modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="კლიენტის ვერსია"><div class="box"><div class="bar"><strong>კლიენტის ვერსია (ასე დაიბეჭდება)</strong><button class="btn primary" id="m-print">დაბეჭდვა</button><button class="btn" id="m-dl">ჩამოტვირთვა</button><button class="btn" id="m-close">დახურვა</button></div><iframe id="m-frame" title="შეთავაზება"></iframe></div></div>`;
  $("#m-frame").srcdoc=offerHtml();
}
async function download(){if(saveQuote(true)===false)return;if(isPending(saveQuote.last)){toast(NEEDOK);render();return}
  const name="SmartPro-შეთავაზება-"+(client.name?client.name.replace(/[\\/:*?"<>|]+/g,"").slice(0,40)+"-":"")+new Date().toISOString().slice(0,10)+".html";
  if(!dl){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([offerHtml()],{type:"text/html"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("ფაილი ჩამოიტვირთა");return}
  try{await dl.save({filename:name,data:offerHtml()});toast("ფაილი შენახულია — გახსენით და დაბეჭდვის ფანჯარა თავად გაიხსნება")}
  catch(e){if(e&&e.code==="declined")return;toast("ვერ ჩამოიტვირთა: "+(e.message||e.code))}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,input[type=checkbox]");if(!t)return;
  if(t.dataset.tab){if(ui.tab==="internal"&&ui.idirty){toast("შიდა კალკულატორის ცვლილებები არ შეინახა");ui.idirty=false;ui.idraft=null}ui.tab=t.dataset.tab;if(ui.tab==="internal")ui.iq=null;saveUi();render();return}
  if(t.dataset.sid){ui.sid=t.dataset.sid;ui.kind="all";ui.cat="all";saveUi();render();return}
  if(t.dataset.psid){ui.psid=t.dataset.psid;saveUi();render();return}
  if(t.dataset.color&&t.classList.contains("cbtn")){ui.color=t.dataset.color;saveUi();render();return}
  if(t.dataset.kind){ui.kind=t.dataset.kind;saveUi();render();return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;render();return}
  if(t.id==="pcolors"){ui.pcolors=t.checked;saveUi();render();return}
  if(t.id==="s-vat"){settings.vat=t.checked;saveSettings();render();return}
  const row=t.closest(".row");
  if(row&&t.type==="checkbox"){setQty(row.dataset.id,t.checked?1:0);return}
  if(row&&t.dataset.d){const l=cart.find(x=>x.id===row.dataset.id&&x.color===ui.color);setQty(row.dataset.id,Math.max(0,(l?l.qty:0)+(+t.dataset.d)));return}
  if(t.dataset.rm!=null){cart.splice(+t.dataset.rm,1);saveCart();render();return}
  if(t.dataset.gallery){showGallery(t.dataset.gallery);return}
  if(t.closest(".gimg")){t.closest(".gimg").classList.toggle("zoom");return}
  if(t.id==="preview"){showPreview();return}
  if(t.id==="saveq"){saveQuote(false);return}
  if(t.id==="refreshrate"){fetchRates(true);return}
  if(t.dataset.qopen){openQuote(t.dataset.qopen,false);return}
  if(t.dataset.iopen){ui.iq=t.dataset.iopen;ui.idraft=null;render();window.scrollTo(0,0);return}
  if(t.id==="iback"){if(ui.idirty)toast("ცვლილებები არ შეინახა");ui.iq=null;ui.idraft=null;ui.idirty=false;render();return}
  if(t.id==="icancel"){ui.idraft=null;ui.idirty=false;render();toast("ცვლილებები გაუქმდა");return}
  if(t.id==="isave"){const Q=ui.idraft;if(!Q)return;
    if(!canRed()&&Q.lines.some(l=>byId[l.id]&&lvl(lineCalc(l))==="bad")){toast("წითლად მონიშნულ პროდუქტს ფასი მინიმუმზე დაბალი აქვს");return}
    const doc=JSON.parse(JSON.stringify(Q));doc.approval=approvalFor(doc.lines,quotes.find(x=>x.id===doc.id));const i=quotes.findIndex(x=>x.id===doc.id);if(i>-1)quotes[i]=doc;else quotes.unshift(doc);persistQuotes(doc);
    if(curQ&&curQ.id===doc.id){cart=doc.lines.map(l=>({id:l.id,color:l.color,qty:l.qty,sale:l.sale,mk:l.mk}));saveCart()}
    ui.idirty=false;ui.idraft=null;render();toast("შეთავაზება № "+doc.no+" შენახულია"+(isPending(doc)?" — ელოდება სუპერ ადმინის დადასტურებას":""));return}
  if(t.dataset.qok){if(!isSuper())return;const q=quotes.find(x=>x.id===t.dataset.qok);if(!q)return;q.approval={state:"approved",sig:redSig(q.lines),at:new Date().toISOString()};persistQuotes(q);ui.idraft=null;render();toast("შეთავაზება № "+q.no+" დადასტურებულია — ახლა შეიძლება დაბეჭდვა");return}
  if(t.dataset.qprint){openQuote(t.dataset.qprint,true);return}
  if(t.dataset.qdel){if(t.dataset.sure){deleteQuote(t.dataset.qdel)}else{t.dataset.sure="1";t.textContent="დარწმუნებული ხართ?";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent="წაშლა"}},3000)}return}
  if(t.dataset.qtoinv){const q=quotes.find(x=>x.id===t.dataset.qtoinv);if(!q)return;const params=encodeURIComponent(JSON.stringify({no:q.no,client:{name:q.client?.name||"",project:q.client?.project||"",phone:q.client?.phone||""},lines:q.lines.map(l=>{const parts=[];if(l.ka)parts.push(l.ka);if(l.code)parts.push("("+l.code+")");if(l.colorKa)parts.push("— "+l.colorKa);const fullName=parts.length?parts.join(" "):(l.name||l.id||"");return{name:fullName,qty:l.qty||1,unit:"ც",price:l.sale||l.price||0,vat:18}}),total:q.total}));window.top.location.href="/invoice?fromQuote="+params;return}
  if(t.id==="s-autoRate"){settings.autoRate=t.checked;saveSettings();if(t.checked)fetchRates(true);else render();return}
  if(t.id==="download"||t.id==="m-dl"){download();return}
  if(t.id==="m-print"){const fr=$("#m-frame");try{fr.contentWindow.focus();fr.contentWindow.print()}catch(err){toast("დაბეჭდვა ვერ მოხერხდა")}return}
  if(t.id==="m-close"){$("#modal").innerHTML="";return}
  if(t.id==="clear"){if(t.dataset.sure){cart=[];client={name:"",project:"",phone:"",note:""};curQ=null;LS.set("curq",null);saveCart();render()}else{t.dataset.sure="1";t.textContent="დარწმუნებული ხართ? დააჭირეთ ისევ";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent="ახალი შეთავაზება"}},3000)}return}
});
function setQty(id,q){
  q=Math.max(0,Math.round(q||0));const i=cart.findIndex(x=>x.id===id&&x.color===ui.color);
  if(q===0){if(i>-1)cart.splice(i,1)}else if(i>-1)cart[i].qty=q;else cart.push({id,color:ui.color,qty:q});
  saveCart();render();
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.smk){const v=t.value.trim().replace(",",".");settings.seriesMk={...(settings.seriesMk||{}),[t.dataset.smk]:v===""?null:v};saveSettings();const ex=$("#example");if(ex)ex.innerHTML=exampleHtml();return}
  if(t.id==="qsearch"){ui.qq=t.value;const pos=t.selectionStart;render();const s=$("#qsearch");s.focus();s.setSelectionRange(pos,pos);return}
  if(t.id==="search"){ui.q=t.value;const pos=t.selectionStart;render();const s=$("#search");s.focus();s.setSelectionRange(pos,pos);return}
  if(t.id.startsWith("cl-")){client[t.id.slice(3)]=t.value;saveCart();return}
  if(t.id==="markup"){settings.markup=t.value;saveSettings();refreshLedgerKeepFocus(t.id);return}
  if(t.dataset.isale!=null||t.dataset.imk!=null||t.dataset.iq!=null){const i=+(t.dataset.isale??t.dataset.imk??t.dataset.iq);const v=t.value.trim().replace(",",".");
    const Q=ui.idraft;if(!Q)return;const L=Q.lines;
    if(t.dataset.isale!=null)L[i].sale=v===""?null:v;else if(t.dataset.imk!=null){L[i].mk=v===""?null:v;L[i].sale=null}else{const qq=Math.round(N(v)||0);if(qq>0)L[i].qty=qq;else return}
    recomputeQuote(Q);ui.idirty=true;
    const id=t.id,pos=t.selectionStart;renderInternal();const el=$("#"+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}return}
  if(t.dataset.sale!=null){const i=+t.dataset.sale;const v=t.value.trim().replace(",",".");cart[i].sale=v===""?null:v;patchLine(i);return}
  if(t.dataset.lmk!=null){const i=+t.dataset.lmk;const v=t.value.trim().replace(",",".");cart[i].mk=v===""?null:v;cart[i].sale=null;patchLine(i);return}
  if(t.dataset.lq!=null){const i=+t.dataset.lq;const q=Math.round(N(t.value)||0);if(q>0){cart[i].qty=q;patchLine(i)}return}
  if(t.dataset.s){const k=t.dataset.s;settings[k]=t.value;saveSettings();if(k==="markup")document.querySelectorAll("[data-smk]").forEach(el=>el.placeholder=t.value);document.querySelectorAll("[id^='sale-']").forEach(el=>{const it=byId[el.id.slice(5)];if(it)el.textContent=saleCell(it,catalog.series.find(x=>x.id===it.sid).colors[0].id)});const ex=$("#example");if(ex)ex.innerHTML=exampleHtml();const fx=$("#fixpu");if(fx)fx.textContent=gel(fixedPerUnit());showRate();return}
  const tr=t.closest("tr[data-id]");
  if(tr){const id=tr.dataset.id;if(t.dataset.f)savePrice(id,{[t.dataset.f]:t.value.trim()===""?null:t.value.trim().replace(",",".")});
    else if(t.dataset.color){const c={...(prices[id]?.colors||{})};c[t.dataset.color]=t.value.trim().replace(",",".");savePrice(id,{colors:c})}
    const s=catalog.series.find(x=>x.id===ui.psid);$("#cost-"+CSS.escape(id)).textContent=gel(costOf(byId[id],s.colors[0].id));const se=$("#sale-"+CSS.escape(id));if(se)se.textContent=saleCell(byId[id],s.colors[0].id);}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.closest(".row")&&t.id.startsWith("q-")){setQty(t.closest(".row").dataset.id,N(t.value)||0);return}
  if(t.dataset.sale!=null||t.dataset.lmk!=null){setTimeout(()=>patchLine(+(t.dataset.sale??t.dataset.lmk)),0);return}
  if(t.dataset.lq!=null){const i=+t.dataset.lq;if(!(N(t.value)>0)){cart.splice(i,1);saveCart();render()}else syncRow(i);return}
  if(t.dataset.s){if(t.id==="s-currency"){settings.currency=t.value;saveSettings()}if(t.id==="s-rateType"){settings.rateType=t.value;saveSettings();if(settings.autoRate){fetchRates(true);return}}render();return}
});
function refreshLedgerKeepFocus(id){const l=$(".ledger");if(!l)return;const pos=$("#"+id)?.selectionStart;l.outerHTML=ledgerHtml();const el=$("#"+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}
  document.querySelectorAll(".row").forEach(r=>{const it=byId[r.dataset.id];const c=costOf(it,ui.color);const pr=r.querySelector(".pr");if(pr&&c!=null)pr.innerHTML=`${gel(roundUp(c*(1+pmk(it)/100)))}<small>ფასი 1 ცალზე</small>`})}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML){$("#modal").innerHTML=""}});

initData();
})();
</script>

</body>
</html>
